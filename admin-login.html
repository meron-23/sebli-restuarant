<!DOCTYPE html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - Sebli Ethiopian Restaurant & Lounge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#8C031C",
              secondary: "#022859",
              accent: "#F28F6B",
              brown: "#593202",
              "background-light": "#f3f4f6",
              "background-dark": "#0D0D0D"
            }
          }
        }
      };
    </script>
  </head>
  <body class="bg-background-light dark:bg-background-dark text-stone-900 dark:text-stone-100">
    <main class="flex min-h-screen items-center justify-center px-4 py-10 sm:px-6 lg:px-8">
      <div class="w-full max-w-md rounded-3xl border border-stone-200 bg-white p-8 shadow-xl dark:border-stone-800 dark:bg-stone-900">
        <div class="text-center">
          <p class="text-sm font-semibold uppercase tracking-[0.3em] text-primary">Sebli Ethiopian</p>
          <h1 class="mt-4 text-3xl font-extrabold tracking-tight">Admin Login</h1>
          <p class="mt-3 text-sm text-stone-600 dark:text-stone-400">
            Enter the admin password to access orders, bookings, and menu management.
          </p>
        </div>

        <form id="adminLoginForm" class="mt-8 space-y-5">
          <div>
            <label class="block text-sm font-semibold text-stone-700 dark:text-stone-300" for="adminPassword">Password</label>
            <input
              id="adminPassword"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              class="mt-2 block w-full rounded-xl border-stone-300 bg-white px-4 py-3 dark:border-stone-700 dark:bg-stone-950"
            />
          </div>

          <p id="loginMessage" class="hidden rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700 dark:border-red-900/60 dark:bg-red-950/40 dark:text-red-300"></p>

          <button
            class="w-full rounded-xl bg-primary px-5 py-3 text-sm font-bold text-white hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary/50"
            type="submit"
          >
            Sign In
          </button>
        </form>

        <div class="mt-6 text-center">
          <a href="index.html" class="text-sm font-medium text-stone-500 hover:text-primary dark:text-stone-400 dark:hover:text-primary">
            Back to website
          </a>
        </div>
      </div>
    </main>

    <script src="sheets-config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
